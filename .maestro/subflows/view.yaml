# Picks OPTION in the wall's View sheet (Wall/Timeline/Map, Freeform/By date/...,
# All/Family/Travel/Personal), then applies it with Done.
appId: "${maestro.platform == 'ios' ? 'dev.gkcoding.lifeThreads' : 'dev.gkcoding.lifethreads'}"
---
- tapOn: "View"
- extendedWaitUntil:
    visible: "Show as"
    timeout: 10000
- tapOn: "${OPTION}"
# Changes apply with Done.
- tapOn: "Done"
- extendedWaitUntil:
    notVisible: "Show as"
    timeout: 10000

# Unlocks Premium with the debug build's test switch (simulators have no
# store account). The real purchase flow is covered by the Flutter tests.
appId: "${maestro.platform == 'ios' ? 'dev.gkcoding.lifeThreads' : 'dev.gkcoding.lifethreads'}"
---
- runFlow: open_settings.yaml
- runFlow: open_premium.yaml
- runFlow:
    file: scroll_to.yaml
    env:
      TARGET: ".*debug mock unlock.*"
      DIRECTION: DOWN
- tapOn: ".*debug mock unlock.*"
- extendedWaitUntil:
    visible: ".*Premium Active.*|.*Premium is active.*"
    timeout: 10000
- tapOn: "Back"
- runFlow:
    when:
      visible: "(?s)Your name.*"
    file: leave_settings.yaml

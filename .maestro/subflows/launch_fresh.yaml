# Opens LifeThreads like a fresh install, in English.
appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
    arguments:
      # iOS: run the app in English whatever the simulator language is.
      "-AppleLanguages": "(en)"
      "-AppleLocale": "en_US"

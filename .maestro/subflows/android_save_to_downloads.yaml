# Android share sheet: save the shared file to Downloads through Files.
appId: "${maestro.platform == 'ios' ? 'dev.gkcoding.lifeThreads' : 'dev.gkcoding.lifethreads'}"
---
- extendedWaitUntil:
    visible: "Files|Save to Files|Drive"
    timeout: 60000
- tapOn: "Files|Save to Files"
- extendedWaitUntil:
    visible: "SAVE|Save"
    timeout: 20000
- tapOn: "SAVE|Save"
- waitForAnimationToEnd

# SET-01 Themes and name, SET-02 Language (German and Arabic),
# SET-03 Restart keeps everything
appId: "${maestro.platform == 'ios' ? 'dev.gkcoding.lifeThreads' : 'dev.gkcoding.lifethreads'}"
name: SET-01/02/03 Name, themes, language, restart
tags: [protocol, set]
---
- runFlow: ../subflows/fresh_wall.yaml
- assertVisible: "More"

# SET-01: change the name.
- runFlow: ../subflows/open_settings.yaml
- tapOn: "(?s)Your name\n.*"
- tapOn: "Lina"
- eraseText: 10
- inputText: "Lina Maria"
- runFlow: ../subflows/hide_keyboard.yaml
- tapOn: "Save"
- assertVisible: "Name updated."
- assertVisible: "(?s)Your name\nLina Maria"

# SET-01: a Premium theme is locked for free users, then works with Premium.
- runFlow: ../subflows/open_themes.yaml
- tapOn: "Midnight Archive.*"
- extendedWaitUntil:
    visible: "Unlock with Premium"
    timeout: 10000
- takeScreenshot: SET-01_theme_locked
- tapOn:
    point: 50%, 8%
- tapOn: "Back"
- runFlow: ../subflows/leave_settings.yaml
- runFlow: ../subflows/unlock_premium.yaml
- runFlow: ../subflows/open_settings.yaml
- runFlow: ../subflows/open_themes.yaml
- tapOn: "Midnight Archive.*"
- tapOn: "Use this theme"
- assertVisible: ".*Midnight Archive selected.*"
- takeScreenshot: SET-01_theme_midnight
- tapOn: "Back"
- runFlow: ../subflows/leave_settings.yaml
- assertVisible: "More"
- takeScreenshot: SET-01_wall_midnight

# SET-02: German, then Arabic (right to left), then back to English.
# The language is picked in a sheet from the Language row.
- runFlow: ../subflows/open_settings.yaml
- tapOn: "(?s)Language\n.*"
- tapOn: "Deutsch"
- extendedWaitUntil:
    visible: "Einstellungen"
    timeout: 10000
- assertVisible: "(?s)Sprache\nDeutsch"
- takeScreenshot: SET-02_german
- tapOn: "(?s)Sprache\n.*"
- tapOn: "العربية"
- extendedWaitUntil:
    visible: "الإعدادات"
    timeout: 10000
- takeScreenshot: SET-02_arabic
- tapOn: "(?s)اللغة\n.*"
- tapOn: "English"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 10000

# SET-03: close the app completely and open it again.
- stopApp
- launchApp:
    appId: "${maestro.platform == 'ios' ? 'dev.gkcoding.lifeThreads' : 'dev.gkcoding.lifethreads'}"
    arguments:
      "-AppleLanguages": "(en)"
- extendedWaitUntil:
    visible: "More"
    timeout: 90000
- runFlow: ../subflows/open_settings.yaml
- assertVisible: "(?s)Your name\nLina Maria"
- assertVisible: "(?s)Midnight Archive.*"
- takeScreenshot: SET-03_after_restart

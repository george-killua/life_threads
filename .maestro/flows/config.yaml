# Run the flows in protocol order and keep going after a failure, so one
# broken step does not hide the results of the others.
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - "INS-02/03 Onboarding and demo wall"
    - "WAL-01/02/07 Add a memory with photos, a person and a place"
    - "WAL-03/04/05/06 Wall, threads, edit and delete, timeline and map"
    - "PRM-01 Premium page"
    - "STO-01..05 Create Story"
    - "YR-01 Thread of the Year"
    - "OTD-01 On this day"
    - "BAK-01/02 Backup and restore"
    - "SET-01/02/03 Name, themes, language, restart"
    - "WAL-08 Free memory limit"

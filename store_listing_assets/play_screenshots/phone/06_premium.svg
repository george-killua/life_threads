<text x="244" y="909" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="760" fill="#c2b6a8">sync key and password.</text>
  <rect x="142" y="988" width="796" height="150" rx="30" fill="#1d1720" fill-opacity="0.9" stroke="#3a2c33"/>
  <circle cx="198" cy="1063" r="26" fill="#d2a24a" fill-opacity="0.20" stroke="#d2a24a"/>
  <text x="244" y="1048" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900" fill="#fff8ea">Display Wall</text>

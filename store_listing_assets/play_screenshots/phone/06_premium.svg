  <text x="142" y="396" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="900" fill="#fff8ea">Backup &amp; privacy</text>
  <text x="142" y="436" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="760" fill="#c2b6a8">Built for memories you control.</text>


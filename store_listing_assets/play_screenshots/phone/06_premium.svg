    <stop offset="0.42" stop-color="#38230f" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="112" height="112" patternUnits="userSpaceOnUse">

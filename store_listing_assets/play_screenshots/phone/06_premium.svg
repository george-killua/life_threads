<text x="244" y="1109" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="760" fill="#c2b6a8">without saving it publicly.</text>
  <rect x="142" y="1188" width="796" height="150" rx="30" fill="#1d1720" fill-opacity="0.9" stroke="#3a2c33"/>
  <circle cx="198" cy="1263" r="26" fill="#d2a24a" fill-opacity="0.20" stroke="#d2a24a"/>

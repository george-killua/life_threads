  <circle cx="198" cy="863" r="26" fill="#d2a24a" fill-opacity="0.20" stroke="#d2a24a"/>
  <text x="244" y="848" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900" fill="#fff8ea">Cloud Sync</text>

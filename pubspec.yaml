name: life_threads
description: "A private animated memory wall for photos, places, and life stories."
publish_to: 'none'
version: 0.1.6+8

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: any
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.0
  photo_manager: ^3.7.1
  path_provider: ^2.1.5
  flutter_map: ^8.2.2
  latlong2: ^0.10.1
  drift: ^2.30.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.1
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  archive: ^4.0.9
  file_picker: ^12.0.0-beta.7
  package_info_plus: ^10.2.1
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.0
  url_launcher: ^6.3.2
  cryptography: ^2.7.0
  share_plus: ^13.3.0
  app_links: ^7.0.0
  flutter_contacts: ^2.0.2
  mobile_scanner: ^7.2.0
  image: ^4.8.0
  image_picker: ^1.2.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.30.0
  build_runner: ^2.10.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/demo_people/

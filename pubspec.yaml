name: life_threads
description: "A private animated memory wall for photos, places, and life stories."
publish_to: 'none'
version: 1.0.0+17

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  intl: any
  flutter_riverpod: ^3.0.3
  go_router: ^18.0.2
  photo_manager: ^3.7.1
  path_provider: ^2.1.5
  flutter_map: ^8.2.2
  latlong2: ^0.10.1
  drift: ^2.30.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.1
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  archive: ^4.0.9
  file_picker: ^13.1.0
  package_info_plus: ^10.2.1
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.0
  in_app_purchase_storekit: ^0.4.13+1
  url_launcher: ^6.3.2
  cryptography: ^2.7.0
  share_plus: ^13.3.0
  app_links: ^7.0.0
  flutter_contacts: ^2.0.2
  mobile_scanner: ^7.2.0
  image: ^4.8.0
  image_picker: ^1.2.2
  vector_map_tiles: ^9.0.0-beta.13
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  gal: ^2.3.3
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  story_video_encoder:
    path: packages/story_video_encoder
  audioplayers: ^6.8.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.30.0
  build_runner: ^2.10.4
  app_links_platform_interface: ^2.0.4
  in_app_purchase_platform_interface: ^1.4.1
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/demo_moments/
    - assets/music/

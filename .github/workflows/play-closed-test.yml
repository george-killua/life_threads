name: Play Closed Test

on:
  workflow_dispatch:
    inputs:
      play_track:
        description: "Google Play track"
        required: true
        default: "alpha"
      release_status:
        description: "draft or completed"
        required: true
        default: "draft"

jobs:
  closed-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify required secrets
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=0
          for name in MAPTILER_KEY GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub secret $name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the secrets in GitHub → Settings → Secrets and variables → Actions, then re-run." >&2
            exit 1
          fi

      - name: Restore Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p android/release
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release/lifethreads-release-key.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=../release/lifethreads-release-key.jks"
          } > android/key.properties
          chmod 600 android/key.properties android/release/lifethreads-release-key.jks

      - name: Upload to closed testing
        working-directory: android
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          PLAY_TRACK: ${{ inputs.play_track }}
          PLAY_RELEASE_STATUS: ${{ inputs.release_status }}
        run: bundle exec fastlane closed_test

name: Play Closed Test

on:
  workflow_dispatch:
    inputs:
      play_track:
        description: "Google Play track"
        required: true
        default: "alpha"
      release_status:
        description: "draft or completed"
        required: true
        default: "draft"

jobs:
  closed-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Restore Android release signing
        run: |
          mkdir -p android/release
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/release/lifethreads-release-key.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../release/lifethreads-release-key.jks
          EOF
          chmod 600 android/key.properties android/release/lifethreads-release-key.jks

      - name: Verify required secrets
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          missing=0
          if [ -z "$MAPTILER_KEY" ]; then
            echo "Missing GitHub secret MAPTILER_KEY" >&2
            missing=1
          fi
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "Missing GitHub secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64" >&2
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the secrets in GitHub → Settings → Secrets and variables → Actions, then re-run." >&2
            exit 1
          fi

      - name: Upload to closed testing
        working-directory: android
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          PLAY_TRACK: ${{ inputs.play_track }}
          PLAY_RELEASE_STATUS: ${{ inputs.release_status }}
        run: bundle exec fastlane closed_test

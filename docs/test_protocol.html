<style>
/* Layout: a single protocol column; a sticky status strip on top; each test is a row card with ID, steps, expected result and a result switch. */
:root {
  --bg: #f7f4f0;
  --surface: #ffffff;
  --surface-2: #efe9e2;
  --fg: #231b1f;
  --muted: #6d6168;
  --line: #e0d7cf;
  --gold: #a8741a;
  --gold-soft: #f3e3c4;
  --plum: #4a2a3d;
  --pass: #2f7d4f;
  --pass-bg: #e2f2e8;
  --fail: #b3362f;
  --fail-bg: #f8e1df;
  --block: #9a6a12;
  --block-bg: #f6ead1;
  --na: #6d6168;
  --na-bg: #ece6e1;
  --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --font-arabic: "IBM Plex Sans Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18121a; --surface: #221a24; --surface-2: #2b212e; --fg: #f1e9e4; --muted: #b3a5ad;
    --line: #3a2e3d; --gold: #e0b25c; --gold-soft: #3b2e1e; --plum: #d9c2d0;
    --pass: #7fd3a0; --pass-bg: #1d3327; --fail: #f2948c; --fail-bg: #3d2120;
    --block: #e8c06e; --block-bg: #3a2f19; --na: #b3a5ad; --na-bg: #2f2730;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18121a; --surface: #221a24; --surface-2: #2b212e; --fg: #f1e9e4; --muted: #b3a5ad;
  --line: #3a2e3d; --gold: #e0b25c; --gold-soft: #3b2e1e; --plum: #d9c2d0;
  --pass: #7fd3a0; --pass-bg: #1d3327; --fail: #f2948c; --fail-bg: #3d2120;
  --block: #e8c06e; --block-bg: #3a2f19; --na: #b3a5ad; --na-bg: #2f2730;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(28px, 6vw, 40px); letter-spacing: -0.5px; }
h2 { font-size: 22px; }
h3 { font-size: 17px; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: 0.3px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--gold); }

header.doc { display: flex; flex-direction: column; gap: 14px; }
.head-row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang button { background: transparent; color: var(--muted); border: 0; padding: 6px 14px; font: 500 13px var(--font-body); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--plum); color: var(--bg); }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.meta div { padding: 10px 12px; border-inline-end: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
.meta dt { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
.meta dd { margin: 2px 0 0; font-weight: 600; overflow-wrap: anywhere; }
.lead { max-width: 65ch; color: var(--fg); }

.status { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--surface-2); }
.bar span { display: block; height: 100%; transition: width .3s; }
.bar .p { background: var(--pass); } .bar .f { background: var(--fail); } .bar .b { background: var(--block); } .bar .n { background: var(--na); }
.counts { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.counts b { color: var(--fg); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

section.block { display: flex; flex-direction: column; gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
input, select, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea { min-height: 60px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
ul.rules { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 6px; max-width: 70ch; }
.note { background: var(--gold-soft); border-radius: 10px; padding: 12px 14px; font-size: 14px; }

.area-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; border-bottom: 2px solid var(--fg); padding-bottom: 6px; }
.area-head .mono { color: var(--muted); }
.case { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: 1fr; gap: 10px; border-inline-start-width: 4px; }
.case[data-r="pass"] { border-inline-start-color: var(--pass); }
.case[data-r="fail"] { border-inline-start-color: var(--fail); }
.case[data-r="blocked"] { border-inline-start-color: var(--block); }
.case[data-r="na"] { border-inline-start-color: var(--na); }
.case-top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.case-top .id { font-family: var(--font-mono); font-size: 12.5px; color: var(--gold); font-weight: 500; }
.tag { font-family: var(--font-mono); font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.tag.p1 { background: var(--plum); color: var(--bg); }
.cols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
@media (max-width: 640px) { .cols { grid-template-columns: 1fr; } }
.cols > div { min-width: 0; }
.cols h4 { margin: 0 0 4px; font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
ol.steps { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 3px; }
.res { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.res button { font: 500 13px var(--font-body); border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 99px; padding: 5px 12px; cursor: pointer; }
.res button[data-v="pass"][aria-pressed="true"] { background: var(--pass-bg); color: var(--pass); border-color: var(--pass); }
.res button[data-v="fail"][aria-pressed="true"] { background: var(--fail-bg); color: var(--fail); border-color: var(--fail); }
.res button[data-v="blocked"][aria-pressed="true"] { background: var(--block-bg); color: var(--block); border-color: var(--block); }
.res button[data-v="na"][aria-pressed="true"] { background: var(--na-bg); color: var(--na); border-color: var(--na); }
.case textarea { min-height: 44px; font-size: 14px; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { font: 600 14px var(--font-body); border-radius: 10px; padding: 10px 16px; cursor: pointer; border: 1px solid var(--plum); background: var(--plum); color: var(--bg); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.danger { background: transparent; color: var(--fail); border-color: var(--fail); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
pre#report { direction: auto; unicode-bidi: plaintext; background: var(--surface-2); border-radius: 10px; padding: 12px; font: 12.5px/1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow: auto; margin: 0; }
.addr { font-family: var(--font-mono); background: var(--surface-2); padding: 2px 8px; border-radius: 6px; user-select: all; }
footer { color: var(--muted); font-size: 13px; }
:root[lang="ar"] body, :root[lang="ar"] h1, :root[lang="ar"] h2, :root[lang="ar"] h3, :root[lang="ar"] input, :root[lang="ar"] textarea, :root[lang="ar"] .res button, :root[lang="ar"] .btn { font-family: var(--font-arabic); }
:root[lang="ar"] h1 { letter-spacing: 0; }
.ltr { direction: ltr; unicode-bidi: isolate; }
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>

<div class="wrap">
  <header class="doc">
    <div class="head-row">
      <span class="eyebrow">LT-TP-100 · Beta</span>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="lang-en" data-lang="en">English</button>

        <button type="button" id="lang-ar" data-lang="ar">العربية</button>

    <h1 data-t="title"></h1>

      <div><dt data-t="mApp"></dt><dd class="ltr">LifeThreads – Memory Wall</dd></div>
      <div><dt data-t="mBuild"></dt><dd class="ltr">1.0.0 (21)</dd></div>
      <div><dt data-t="mPlatforms"></dt><dd>iOS (TestFlight) · Android (Play)</dd></div>
      <div><dt data-t="mPeriod"></dt><dd data-t="period"></dd></div>
      <div><dt data-t="mContact"></dt><dd class="ltr">info@gkcoding.dev</dd></div>
    </dl>
  </header>

  <div class="status" aria-live="polite">
    <div class="bar" aria-hidden="true"><span class="p"></span><span class="f"></span><span class="b"></span><span class="n"></span></div>
    <div class="counts" id="counts"></div>
  </div>

  <section class="block" id="tester">
    <div class="area-head"><h2 data-t="sTester"></h2><span class="mono" data-t="sTesterHint"></span></div>
    <div class="panel">
      <div class="form">
        <label class="f"><span data-t="fName"></span><input id="f-name" autocomplete="name"></label>
        <label class="f"><span data-t="fPlatform"></span>
          <select id="f-platform"><option value=""></option><option>iPhone / iPad</option><option>Android</option></select></label>
        <label class="f"><span data-t="fDevice"></span><input id="f-device" placeholder="iPhone 15, Pixel 8, Galaxy S23 …"></label>
        <label class="f"><span data-t="fOs"></span><input id="f-os" placeholder="iOS 27.0 / Android 16"></label>
        <label class="f"><span data-t="fLang"></span>
          <select id="f-lang"><option value=""></option><option>English</option><option>Deutsch</option><option>العربية</option></select></label>
        <label class="f"><span data-t="fDate"></span><input id="f-date" type="date"></label>
      </div>
    </div>
  </section>

  <section class="block" id="howto">
    <div class="area-head"><h2 data-t="sHow"></h2></div>
    <ul class="rules" id="rules"></ul>
    <div class="note" data-t="money"></div>
  </section>

  <div id="areas" class="block"></div>

  <section class="block" id="finish">
    <div class="area-head"><h2 data-t="sReport"></h2></div>
    <p class="lead" data-t="reportLead"></p>
    <div class="actions">
      <button class="btn" type="button" id="copy" data-t="copy"></button>
      <span class="addr ltr">info@gkcoding.dev</span>
      <span id="copied" class="mono" hidden></span>
    </div>
    <pre id="report"></pre>
    <div class="actions">
      <button class="btn danger" type="button" id="reset" data-t="reset"></button>
      <span class="confirm" id="reset-confirm" hidden>
        <span data-t="resetQ"></span>
        <button class="btn danger" type="button" id="reset-yes" data-t="resetYes"></button>
        <button class="btn ghost" type="button" id="reset-no" data-t="resetNo"></button>
      </span>
    </div>
  </section>

  <footer data-t="footer"></footer>
</div>

    de: ["Öffnen, bearbeiten, löschen", ["Eine Karte antippen.", "Titel ändern, ein Foto hinzufügen, speichern.", "Eine Test-Erinnerung löschen."], "Die Detailseite zeigt alle Fotos und die Geschichte wie ein Kapitel. Änderungen werden gespeichert. Gelöschte Erinnerungen verschwinden aus Wand, Zeitleiste und Karte."] },
  { id: "WAL-06", p: 2,
    en: ["Timeline and map", ["Switch from Wall to Timeline.", "Switch to Map.", "Use the category filter on the wall."], "The timeline is ordered by date. The map shows memories with a place, grouped by location. The filter shows only the chosen kind."],
    de: ["Zeitleiste und Karte", ["Von Wand auf Zeitleiste wechseln.", "Auf Karte wechseln.", "Den Kategorie-Filter an der Wand nutzen."], "Die Zeitleiste ist nach Datum sortiert. Die Karte zeigt Erinnerungen mit Ort, nach Ort gruppiert. Der Filter zeigt nur die gewählte Art."] },
  { id: "WAL-07", p: 2,
    en: ["People and places", ["In a memory, add a person from your contacts.", "Add a photo that has a location (taken with your phone camera)."], "The person is listed in the memory. The place is filled in from the photo and the memory shows up on the map."],
    de: ["Menschen und Orte", ["In einer Erinnerung eine Person aus den Kontakten hinzufügen.", "Ein Foto mit Standort hinzufügen (mit der Handykamera aufgenommen)."], "Die Person steht in der Erinnerung. Der Ort wird aus dem Foto übernommen und die Erinnerung erscheint auf der Karte."] },
  { id: "WAL-08", p: 2,
    en: ["Free limit", ["Without Premium, add memories until you reach 30 (only if you have time)."], "At 30 memories the app explains the free limit kindly and offers Premium. Nothing you saved is lost."],
    de: ["Gratis-Limit", ["Ohne Premium Erinnerungen anlegen, bis es 30 sind (nur wenn du Zeit hast)."], "Bei 30 Erinnerungen erklärt die App das Gratis-Limit freundlich und bietet Premium an. Nichts Gespeichertes geht verloren."] },
  { id: "WAL-09", p: 2,
    en: ["Search, several walls, hidden memories", ["Tap the magnifier and search for a place, a person or a year.", "Premium: More › New wall, give it a name. Use Move memories here (or a memory's menu › Move to wall).", "Open a memory's menu and choose Hide. Then View › Hidden memories."], "Search finds memories as you type. Each wall shows only its own memories; the switcher at the top changes walls. A hidden memory leaves the wall and comes back only after Face ID or the passcode."],
    de: ["Suche, mehrere Wände, ausgeblendete Erinnerungen", ["Auf die Lupe tippen und nach einem Ort, einer Person oder einem Jahr suchen.", "Premium: Mehr › Neue Wand, benennen. Erinnerungen hierher verschieben nutzen (oder im Menü einer Erinnerung › Auf Wand verschieben).", "Im Menü einer Erinnerung Ausblenden wählen. Dann Ansicht › Ausgeblendete Erinnerungen."], "Die Suche findet Erinnerungen beim Tippen. Jede Wand zeigt nur ihre eigenen Erinnerungen; oben wechselst du die Wand. Eine ausgeblendete Erinnerung verschwindet von der Wand und kommt nur nach Face ID oder Code zurück."] },
  { id: "WAL-10", p: 2,
    en: ["Edit pencils, Undo, Open in Maps", ["Open a memory and tap the pencil on a section (for example Gallery).", "Delete a memory, then tap Undo in the message at the bottom.", "On the Place card tap Open in Maps."], "The pencil opens the edit screen at that section. Undo brings the memory back. Maps opens at the memory's place."],
    de: ["Bearbeiten-Stifte, Rückgängig, In Karten öffnen", ["Eine Erinnerung öffnen und auf den Stift eines Abschnitts tippen (z. B. Galerie).", "Eine Erinnerung löschen, dann in der Meldung unten Rückgängig tippen.", "Auf der Ort-Karte In Karten öffnen tippen."], "Der Stift öffnet die Bearbeitung genau bei diesem Abschnitt. Rückgängig holt die Erinnerung zurück. Karten öffnet sich beim Ort der Erinnerung."] },
  { id: "WAL-11", p: 1,
    en: ["Unfinished memory kept as a draft", ["Tap + › Memory, type a title and pick a photo.", "Leave with the back arrow without saving (or close the app completely).", "Tap + › Memory again."], "Leaving shows “Kept as a draft”. Next time the app asks “Continue where you left off?”: Continue draft brings back the title and photo, Start new begins empty."],
    de: ["Unfertige Erinnerung bleibt als Entwurf", ["Auf + › Erinnerung tippen, einen Titel schreiben und ein Foto wählen.", "Mit dem Zurück-Pfeil gehen, ohne zu speichern (oder die App ganz schließen).", "Wieder auf + › Erinnerung tippen."], "Beim Verlassen erscheint „Als Entwurf behalten“. Beim nächsten Mal fragt die App „Weitermachen, wo du aufgehört hast?“: Entwurf fortsetzen bringt Titel und Foto zurück, Neu beginnen startet leer."] },
  { id: "WAL-12", p: 2,
    en: ["Look back on a month", ["Open More › Look back on a month.", "Use the arrows to move to other months.", "In the first week of a month: check the card on the wall for the month before."], "You see “Your September” (for example) with its memories, the people and places in them, and Create story. An empty month says so in the middle of the screen, with Add a memory."],
    de: ["Monatsrückblick", ["Mehr › Monatsrückblick öffnen.", "Mit den Pfeilen zu anderen Monaten wechseln.", "In der ersten Woche eines Monats: die Karte an der Wand für den Vormonat ansehen."], "Du siehst z. B. „Dein September“ mit seinen Erinnerungen, den Menschen und Orten darin und Story erstellen. Ein leerer Monat sagt das in der Bildschirmmitte, mit Erinnerung hinzufügen."] },
  { id: "WAL-13", p: 1,
    en: ["Home screen widget", ["iPhone: long-press the LifeThreads icon and pick a widget size (or Edit › Add widget › LifeThreads). Android: long-press the home screen › Widgets › LifeThreads.", "Tap the widget.", "Turn on the app lock (Settings › Privacy › App lock) and look at the widget again."], "The widget shows a memory with its photo – one from this day in an earlier year when there is one – and changes each day. A tap opens that memory. With the app lock on it only says “LifeThreads is locked”, without a photo."],
    de: ["Widget auf dem Home-Bildschirm", ["iPhone: lange auf das LifeThreads-Icon drücken und eine Widget-Größe wählen (oder Bearbeiten › Widget hinzufügen › LifeThreads). Android: lange auf den Home-Bildschirm drücken › Widgets › LifeThreads.", "Auf das Widget tippen.", "Die App-Sperre einschalten (Einstellungen › Privatsphäre › App-Sperre) und das Widget wieder ansehen."], "Das Widget zeigt eine Erinnerung mit Foto – eine von diesem Tag in einem früheren Jahr, wenn es eine gibt – und wechselt jeden Tag. Ein Tippen öffnet diese Erinnerung. Mit App-Sperre steht nur „LifeThreads ist gesperrt“ da, ohne Foto."] }
 ]},

    de: ["Premium-Seite", ["Einstellungen öffnen, dann Premium."], "Die Seite zeigt zuerst das Jahresabo (mit Ersparnis) und das Monatsabo, beide mit Preis aus dem Store, was Premium enthält, die Verlängerungsbedingungen und funktionierende Links zu AGB und Datenschutz."] },

  { id: "PRM-04", p: 1,
    en: ["Redeem your promo code (Android)", ["Open the Play Store app, tap your profile picture, then Payments & subscriptions, then Redeem code.", "Enter the code from George and confirm.", "Open LifeThreads. If Premium is not active yet, open Premium and tap Restore."], "The Play Store confirms 2 months free. LifeThreads shows Premium Active."],

 ]},
 { key: "STO", en: "Create Story", de: "Story erstellen", cases: [
  { id: "STO-01", p: 1,

    de: ["Erinnerungen wählen", ["Story erstellen öffnen.", "3–6 Erinnerungen wählen. Ab 7 Erinnerungen die Suche nutzen (Name, Ort oder Jahr)."], "Erinnerungen lassen sich an- und abwählen. Die Suche findet nach Titel, Ort und Jahr."] },
  { id: "STO-02", p: 1,
    en: ["Story image", ["Try the templates Single memory, Thread, Collage and Quote.", "Write a caption."], "Each template looks good with your photos. Text is never cut off."],
    de: ["Story-Bild", ["Die Vorlagen Einzelne Erinnerung, Faden, Collage und Zitat ausprobieren.", "Eine Bildunterschrift schreiben."], "Jede Vorlage sieht mit deinen Fotos gut aus. Kein Text wird abgeschnitten."] },
  { id: "STO-03", p: 1,
    en: ["Reorder, add, remove", ["In the editor, hold and drag a memory to change the order.", "Add one more memory, remove one."], "The story updates right away in the new order."],
    de: ["Sortieren, hinzufügen, entfernen", ["Im Editor eine Erinnerung halten und ziehen, um die Reihenfolge zu ändern.", "Eine Erinnerung hinzufügen, eine entfernen."], "Die Story aktualisiert sich sofort in der neuen Reihenfolge."] },
  { id: "STO-04", p: 1,
    en: ["Video with music", ["Switch on Video.", "Choose a mood and a song, listen to it.", "Drag the trimmer to choose which part of the song plays.", "Create the video."], "The video plays with the chosen part of the song. Making it takes a few seconds and shows progress."],
    de: ["Video mit Musik", ["Video einschalten.", "Eine Stimmung und einen Song wählen, anhören.", "Den Regler ziehen, um den Songteil zu wählen.", "Video erstellen."], "Das Video spielt mit dem gewählten Songteil. Das Erstellen dauert ein paar Sekunden und zeigt den Fortschritt."] },
  { id: "STO-05", p: 1,
    en: ["Share and save", ["Save the video to your photos.", "Share an image to Instagram Stories, WhatsApp or Snapchat."], "The file is in your gallery. Instagram/WhatsApp open with the story ready to post, in the right format (9:16)."],
    de: ["Teilen und speichern", ["Das Video in deinen Fotos speichern.", "Ein Bild in Instagram Stories, WhatsApp oder Snapchat teilen."], "Die Datei ist in deiner Galerie. Instagram/WhatsApp öffnen sich mit der fertigen Story im richtigen Format (9:16)."] }
 ]},
 { key: "YR", en: "Thread of the Year", de: "Faden des Jahres", cases: [
  { id: "YR-01", p: 2,
    en: ["Your year as a film", ["Open Thread of the Year (on the wall card or in the menu).", "Choose a year with several memories.", "Swap, remove or add memories; choose music.", "Preview, then export the video and an image."], "The film plays your memories in order with music and ends with a short summary (places, people, feeling). Export and save work."],
    de: ["Dein Jahr als Film", ["Faden des Jahres öffnen (Karte an der Wand oder im Menü).", "Ein Jahr mit mehreren Erinnerungen wählen.", "Erinnerungen tauschen, entfernen oder hinzufügen; Musik wählen.", "Vorschau ansehen, dann Video und Bild exportieren."], "Der Film zeigt deine Erinnerungen der Reihe nach mit Musik und endet mit einer kurzen Zusammenfassung (Orte, Menschen, Gefühl). Export und Speichern funktionieren."] }
 ]},
 { key: "OTD", en: "On this day", de: "An diesem Tag", cases: [
  { id: "OTD-01", p: 2,
    en: ["Daily reminder", ["Create a memory dated exactly one year ago today.", "Switch on the On this day reminder and allow notifications.", "Set the time a few minutes ahead and wait."], "The memory is shown as 1 year ago today. A notification arrives at the chosen time and opens the memory."],
    de: ["Tägliche Erinnerung", ["Eine Erinnerung mit Datum genau heute vor einem Jahr anlegen.", "Die An-diesem-Tag-Erinnerung einschalten und Mitteilungen erlauben.", "Die Uhrzeit ein paar Minuten in die Zukunft stellen und warten."], "Die Erinnerung wird als heute vor 1 Jahr gezeigt. Eine Mitteilung kommt zur gewählten Zeit und öffnet die Erinnerung."] }
 ]},
 { key: "FAM", en: "Family walls", de: "Familienwände", cases: [

    en: ["Sign in and create a family wall", ["Open Family walls.", "Sign in with Google (or Apple on iPhone) and accept the rules.", "Create a family wall and give it a name."], "With Premium the wall is created and opens. Without Premium the app explains that creating a wall needs Premium."],
    de: ["Anmelden und Familienwand erstellen", ["Familienwände öffnen.", "Mit Google (oder Apple auf dem iPhone) anmelden und die Regeln akzeptieren.", "Eine Familienwand erstellen und benennen."], "Mit Premium wird die Wand erstellt und geöffnet. Ohne Premium erklärt die App, dass Erstellen Premium braucht."] },
  { id: "FAM-02", p: 1,
    en: ["Invite and join (two phones)", ["On the wall, create an invite link and send it to a second person.", "The second person opens the link, signs in and joins (joining is free)."], "The second person sees the family wall. Both see each other in the member list."],
    de: ["Einladen und beitreten (zwei Handys)", ["An der Wand einen Einladungslink erstellen und an eine zweite Person schicken.", "Die zweite Person öffnet den Link, meldet sich an und tritt bei (Beitreten ist gratis)."], "Die zweite Person sieht die Familienwand. Beide sehen sich in der Mitgliederliste."] },

  { id: "FAM-04", p: 2,
    en: ["Report, block, remove", ["Report a test memory (choose a reason).", "Block a member, then unblock.", "As owner, remove a member; as member, leave a wall."], "Each action asks for confirmation and works. Removed members no longer see the wall."],

 ]},

 ]},

  { id: "SET-04", p: 1,

 ]}

          update();
        });
        res.appendChild(b);
      });
      card.appendChild(res);
      var ta = el("textarea", { id: "note-" + c.id, placeholder: L.notes, "aria-label": c.id + " " + L.notes });
      ta.value = state.notes[c.id] || "";
      ta.addEventListener("input", function () { state.notes[c.id] = ta.value; save(); update(); });
      card.appendChild(ta);
      sec.appendChild(card);
    });
    root.appendChild(sec);
  });
}

function applyText() {
  var L = T[state.lang];
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(function (n) { var v = L[n.getAttribute("data-t")]; if (typeof v === "string") n.textContent = v; });
  var ul = document.getElementById("rules"); ul.textContent = "";
  L.rules.forEach(function (r) { ul.appendChild(el("li", { text: r })); });
  document.getElementById("lang-en").setAttribute("aria-pressed", String(state.lang === "en"));
  document.getElementById("lang-de").setAttribute("aria-pressed", String(state.lang === "de"));
  document.getElementById("lang-ar").setAttribute("aria-pressed", String(state.lang === "ar"));
  renderAreas(); update();
}

function counts() {
  var c = { total: 0, pass: 0, fail: 0, blocked: 0, na: 0 };
  allCases().forEach(function (x) { c.total++; var r = state.res[x.id]; if (r) c[r]++; });
  c.done = c.pass + c.fail + c.blocked + c.na; return c;
}

function report() {
  var L = T[state.lang], t = state.tester, c = counts(), lines = [];
  lines.push(L.rTitle + " · LifeThreads 1.0.0 (21)");
  lines.push(L.fName + ": " + (t.name || "-") + " | " + L.fPlatform + ": " + (t.platform || "-") + " | " + L.fDevice + ": " + (t.device || "-") + " | " + L.fOs + ": " + (t.os || "-") + " | " + L.fLang + ": " + (t.lang || "-") + " | " + L.fDate + ": " + (t.date || "-"));
  lines.push(c.done + "/" + c.total + " " + L.cDone + " · " + c.pass + " " + L.cPass + " · " + c.fail + " " + L.cFail + " · " + c.blocked + " " + L.cBlock + " · " + c.na + " " + L.cNa);
  lines.push("");
  lines.push("== " + L.rIssues + " ==");
  var issues = allCases().filter(function (x) { return state.res[x.id] === "fail" || state.res[x.id] === "blocked"; });
  if (!issues.length) lines.push(L.rNone);
  issues.forEach(function (x) { lines.push("[" + L[state.res[x.id]].toUpperCase() + "] " + x.id + " " + x[state.lang][0] + (state.notes[x.id] ? "\n    " + state.notes[x.id].replace(/\n/g, "\n    ") : "")); });
  lines.push("");
  lines.push("== " + L.rAll + " ==");
  allCases().forEach(function (x) {
    var r = state.res[x.id];
    lines.push(x.id + "  " + (r ? L[r] : L.rOpen) + "  " + x[state.lang][0] + (state.notes[x.id] && r !== "fail" && r !== "blocked" ? " — " + state.notes[x.id].replace(/\n/g, " ") : ""));
  });
  return lines.join("\n");
}

function update() {
  var L = T[state.lang], c = counts(), bar = document.querySelector(".bar");
  ["p", "f", "b", "n"].forEach(function (k, i) {
    var v = [c.pass, c.fail, c.blocked, c.na][i];
    bar.querySelector("." + k).style.width = (100 * v / c.total) + "%";
  });
  var ct = document.getElementById("counts"); ct.textContent = "";
  [[c.done + "/" + c.total, L.cDone, null], [c.pass, L.cPass, "var(--pass)"], [c.fail, L.cFail, "var(--fail)"], [c.blocked, L.cBlock, "var(--block)"], [c.na, L.cNa, "var(--na)"]].forEach(function (p) {
    var s = el("span");
    if (p[2]) { var d = el("span", { "class": "dot" }); d.style.background = p[2]; s.appendChild(d); }
    s.appendChild(el("b", { text: String(p[0]) })); s.appendChild(document.createTextNode(" " + p[1]));
    ct.appendChild(s);
  });
  document.getElementById("report").textContent = report();
}

["name", "platform", "device", "os", "lang", "date"].forEach(function (f) {
  var n = document.getElementById("f-" + f);
  if (state.tester[f]) n.value = state.tester[f];
  n.addEventListener("input", function () { state.tester[f] = n.value; save(); update(); });
  n.addEventListener("change", function () { state.tester[f] = n.value; save(); update(); });
});
if (!state.tester.date) { var dd = new Date(); document.getElementById("f-date").value = dd.toISOString().slice(0, 10); state.tester.date = document.getElementById("f-date").value; }

document.querySelectorAll(".lang button").forEach(function (b) {
  b.addEventListener("click", function () { state.lang = b.getAttribute("data-lang"); save(); applyText(); });
});

document.getElementById("copy").addEventListener("click", function () {
  var L = T[state.lang], msg = document.getElementById("copied"), text = report();
  function selectIt() { var r = document.createRange(); r.selectNodeContents(document.getElementById("report")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  var done = function (ok) { msg.textContent = ok ? L.copied : L.copyFail; msg.hidden = false; if (!ok) selectIt(); setTimeout(function () { msg.hidden = true; }, 4000); };
  try { navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); }); } catch (e) { done(false); }
});

document.getElementById("reset").addEventListener("click", function () { document.getElementById("reset-confirm").hidden = false; });
document.getElementById("reset-no").addEventListener("click", function () { document.getElementById("reset-confirm").hidden = true; });
document.getElementById("reset-yes").addEventListener("click", function () {
  state.res = {}; state.notes = {}; save();
  document.getElementById("reset-confirm").hidden = true; applyText();
});

applyText();
</script>
